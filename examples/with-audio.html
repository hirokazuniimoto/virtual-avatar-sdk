<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AvatarSpeaker - 音声ありの使い方</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
    }
    #avatar-container {
      width: 400px;
      height: 600px;
      border: 1px solid #ccc;
      margin: 20px auto;
    }
    .controls {
      text-align: center;
      margin: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>AvatarSpeaker - 音声ありの使い方</h1>
  
  <div id="avatar-container"></div>
  
  <div class="controls">
    <button onclick="sayWithAudio()">音声ありで発話</button>
    <input type="file" id="audio-file" accept="audio/*">
  </div>

  <!-- Import maps for dependencies -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.4/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.4.4/lib/three-vrm-animation.module.js"
      }
    }
  </script>

  <script type="module">
    import { AvatarSpeaker } from '../dist/index.esm.js'

    const ai = new AvatarSpeaker({
      avatar: '/assets/avatars/AvatarSample_A.vrm',
      canvas: document.querySelector('#avatar-container')
    })

    await ai.ready()

    window.sayWithAudio = async () => {
      const fileInput = document.getElementById('audio-file')
      const file = fileInput.files[0]
      
      if (file) {
        const audioUrl = URL.createObjectURL(file)
        const audio = new Audio(audioUrl)
        
        await ai.say('音声ありで発話します（音声ファイルに合わせた発話内容を入れる）', { audio })
        
        URL.revokeObjectURL(audioUrl)
      } else {
        // デモ用：音声ファイルがない場合はテキストのみ
        await ai.say('音声ファイルを選択してください')
      }
    }
  </script>
</body>
</html>
